name: Deploy

# Deploys main to https://skyline.codz.me (Cloudflare Workers static assets, see wrangler.jsonc).
# The job uses the "production" environment, which waits for a maintainer's approval before it runs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: github.repository == 'hjun1052/skyline-map'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://skyline.codz.me
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Self-checks
        run: npm run check && npm run check:i18n
      - name: Deploy to Cloudflare
        id: deploy
        run: |
          set -o pipefail
          npx --yes wrangler@4.40.3 deploy | tee deploy.log
          echo "version=$(grep -oE 'Current Version ID: [0-9a-f-]+' deploy.log | awk '{print $4}')" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Cloudflare's bot protection answers GitHub's runners with 403, so the check asks Cloudflare which
      # version serves all traffic instead of fetching the page.
      - name: Confirm this version serves all traffic
        run: |
          want="${{ steps.deploy.outputs.version }}"
          [ -n "$want" ] || { echo "::error::No version ID in the deploy output"; exit 1; }
          npx --yes wrangler@4.40.3 deployments status --json > status.json
          node -e '
            const s = require("./status.json"), want = process.argv[1];
            const v = s.versions.find((x) => x.version_id === want);
            if (!v || v.percentage !== 100) { console.error(`::error::Version ${want} is not serving 100% of traffic`, JSON.stringify(s.versions)); process.exit(1); }
            console.log(`Version ${want} serves 100% of traffic`);
          ' "$want"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
