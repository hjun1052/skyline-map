name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Self-checks
        run: npm run check
      - name: Korean translations
        run: npm run check:i18n
      - name: .vellummap reader
        run: npm run check:vellummap
      - name: .cmm reader
        run: npm run check:cmm
      - name: Send to Phone (protocol, encryption, relay rules)
        run: npm run check:phone
      - name: .skysave (format, refusals, checks)
        run: npm run check:skysave
      - name: Trips through stops
        run: npm run check:route-stops
      - name: Route shield recognition
        run: npm run check:shields
      - name: Traffic layer colours
        run: npm run check:traffic-style
      - name: Chip rows scroll with a mouse
        run: npm run check:hscroll
      - name: Routes follow TM:PE lane connections
        run: npm run check:lane-route
      - name: Relay worker type check
        run: npx tsc -p worker
      - name: Build with Send to Phone switched on (not deployed)
        run: VITE_SEND_TO_PHONE=1 npx vite build --outDir dist-phone --emptyOutDir

  data:
    name: Data checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Data checks on the sample city
        run: npm run check:data
